# ---------------------------------------------------------------------------
# Caravan - travelling traders
# ---------------------------------------------------------------------------
# A caravan is an NPC that walks a route defined in data/csv/walker_routes.csv
# and carries cargo. When players kill it, it drops its ENTIRE cargo on the
# ground - no chance roll, no rate multipliers, no deep-blue penalty. The
# manifest below is exactly what drops.
#
# Waypoints are per npc id in walker_routes.csv:
#   route_id;npc_id;move_point;chatText;move_x;move_y;move_z;delay;running
#
# Requires AllowNpcWalkers = True (config/head/options.properties).

# Master switch. False = caravans still walk, but drop no cargo.
CaravanEnabled = True

# How far from the corpse cargo scatters, in game units.
CaravanCargoDropRadius = 40

# ---------------------------------------------------------------------------
# Cargo manifests: Cargo<npcId> = itemId,count;itemId,count;...
# ---------------------------------------------------------------------------
# 100203 - Caravan Leader. Test manifest: adena, D-grade mats, a few crystals.
Cargo100203 = 57,50000;1864,20;1866,20;1458,50
