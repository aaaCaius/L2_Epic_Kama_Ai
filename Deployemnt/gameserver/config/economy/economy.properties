# =================================================================
# Living Aden - economy engine
# Every economic constant lives here. None are hardcoded in Java.
# Reload in game with  //reload economy
# =================================================================

# Master switch. False restores the server to its pre-economy behaviour.
EnableEconomy = True

# ---- the cycle ----
# Minutes of real time per economy cycle.
CycleMinutes = 60
# Players expected in a region at normal activity.
ExpectedPlayers = 20
# Floor on activity so the world keeps breathing when nobody is online.
# Consumption AND production both scale by this - see finding F6.
MinActivity = 0.35

# ---- tiers ----
# Cycles of stock coverage of the NEXT tier's needs required to rise.
TierCoverCycles = 4
# Fraction of that coverage that counts as "covered".
TierCoverFraction = 0.9
# Overall fulfilment needed to rise, and consecutive cycles of it.
TierUpThreshold = 0.90
TierUpCycles = 12
# Fulfilment below which a tier is lost, and consecutive cycles of it.
# NOTE: model test finding F7 - this must sit ABOVE where an under-supplied
# town naturally settles (0.59-0.67) or towns stall permanently under-fed.
TierDownThreshold = 0.70
TierDownCycles = 3
# Population the town supports per tier.
PopulationPerTier = 120
# How fast population drifts toward its cap, per cycle.
PopulationGrowth = 0.04

# ---- satisfaction ----
# Luxury consumed per head at which satisfaction peaks.
LuxuryOptimum = 1.0
# Peak bonus. Model test finding F8: luxury MULTIPLIES fulfilment rather than
# adding to it, so wine cannot rescue a starving town. Bread before circuses.
LuxuryAmplitude = 0.25
# Extra medicine demanded per head per unit of luxury above the optimum.
SicknessFactor = 0.5

# ---- prices ----
# Multiplier applied to an item's reference price as scarcity rises.
BuyScarcityK = 3.0
BuyCap = 4.0
SellScarcityK = 1.5
# The town never spends below this. It stops buying instead.
TreasuryReserve = 500000
# Exports: the worst price available, deliberately. A floor, not a strategy.
ExportPriceFraction = 0.45
# Stock above this multiple of the growth target is exported.
ExportBuffer = 1.8

# ---- production ----
# Units per cycle produced by NPC-held sites, before the satisfaction
# multiplier and activity scaling. Sized so a content NPC-only region holds
# tier 3 and no higher.
NpcSiteOutput = 820

# ---- upkeep ----
WagePerHead = 12
GarrisonCostPerTier = 2000

# ---- persistence and telemetry ----
SaveAllActions = True
LogTransactions = True
SnapshotEveryCycles = 1
