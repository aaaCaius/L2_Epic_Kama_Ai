<html><title>Town Market</title><body>
<table width=270>
<tr><td width=100><font color="LEVEL">Town:</font></td><td align=right width=170>%town%</td></tr>
<tr><td width=100><font color="LEVEL">Standing:</font></td><td align=right width=170>%tier%</td></tr>
<tr><td width=100><font color="LEVEL">People:</font></td><td align=right width=170>%pop%</td></tr>
<tr><td width=100><font color="LEVEL">Contentment:</font></td><td align=right width=170>%sat%</td></tr>
</table>
<br>
<img src="l2ui.SquareGray" width=270 height=1><br>
How well the town is supplied:<br>
<table width=270>
%needs%
</table>
<img src="l2ui.SquareGray" width=270 height=1><br>
<br>
<center><table width=160>
<tr>
<td width=75><button value="Buy" action="bypass -h npc_%objectId%_eco_shop" width=75 height=21 back="L2UI_ch3.Btn1_normalOn" fore="L2UI_ch3.Btn1_normal"></td>
<td width=10></td>
<td width=75><button value="Sell" action="bypass -h npc_%objectId%_eco_sell" width=75 height=21 back="L2UI_ch3.Btn1_normalOn" fore="L2UI_ch3.Btn1_normal"></td>
</tr>
</table></center>
<br>
<center><table width=75>
<tr><td width=75><button value="Close" action="bypass -h npc_%objectId%_eco_close" width=75 height=21 back="L2UI_ch3.Btn1_normalOn" fore="L2UI_ch3.Btn1_normal"></td></tr>
</table></center>
</body></html>
