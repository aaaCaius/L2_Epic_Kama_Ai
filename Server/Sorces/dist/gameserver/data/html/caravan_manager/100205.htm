<html><title>Caravan Manager</title><body>
<table width=270>
<tr><td width=100><font color="LEVEL">Route:</font></td><td align=right width=170>Gludio</td></tr>
<tr><td width=100><font color="LEVEL">On the road:</font></td><td align=right width=170>%active% of %max%</td></tr>
<tr><td width=100><font color="LEVEL">Cargo lines:</font></td><td align=right width=170>%cargolines%</td></tr>
</table>
<br>
<img src="l2ui.SquareGray" width=270 height=1><br>
<center><table width=160>
<tr>
<td width=75><button value="Dispatch" action="bypass -h npc_%objectId%_spawn_caravan" width=75 height=21 back="L2UI_ch3.Btn1_normalOn" fore="L2UI_ch3.Btn1_normal"></td>
<td width=10></td>
<td width=75><button value="Cargo" action="bypass -h npc_%objectId%_cargo" width=75 height=21 back="L2UI_ch3.Btn1_normalOn" fore="L2UI_ch3.Btn1_normal"></td>
</tr>
</table></center>
<br>
<img src="l2ui.SquareGray" width=270 height=1><br>
<center><table width=75>
<tr><td width=75><button value="Close" action="bypass -h npc_%objectId%_close" width=75 height=21 back="L2UI_ch3.Btn1_normalOn" fore="L2UI_ch3.Btn1_normal"></td></tr>
</table></center>
</body></html>
